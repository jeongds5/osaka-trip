<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0C10">
  <meta name="description" content="오사카 7인 우정여행 일정 · 취향 설문">
  <title>오사카 7인 우정여행</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- =================================================================
       🔧 Firebase 설정 구역 — 여기만 본인 프로젝트 값으로 바꾸세요
       -----------------------------------------------------------------
       Firebase 콘솔 → ⚙️ 프로젝트 설정 → 일반 → "내 앱" → 웹 앱 →
       "SDK 설정 및 구성" → "구성(Config)"에 나오는 값을 그대로 복사합니다.

       ※ 이 값들은 "비밀번호"가 아닙니다. Firebase 웹 앱의 apiKey는
         브라우저에 공개되도록 설계된 식별자이며, 실제 데이터 보호는
         firestore.rules(보안 규칙)가 담당합니다.
       ※ 관리자 비밀번호 · 서버용 비밀 키 · AI API 키는 절대 여기에 넣지 마세요.
       ================================================================= -->
  <script>
    window.FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
  </script>
  <!-- ============== Firebase 설정 구역 끝 ============== -->

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✈️</span>
      <div>
        <h1>오사카 7인 우정여행</h1>
        <p>2027년 2월 · 대구 출발 · 7명 일정 &amp; 팀 조율</p>
      </div>
    </div>
    <div id="conn-pill" class="pill pill-wait" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="conn-text">연결 확인 중</span>
    </div>
  </header>

  <div id="setup-banner" class="banner banner-warn" hidden>
    <strong>Firebase 설정이 필요해요.</strong>
    index.html의 "Firebase 설정 구역"에 본인 프로젝트 값을 넣어야 응답이 저장됩니다. (지금은 화면 미리보기만 가능)
  </div>
  <div id="offline-banner" class="banner banner-error" hidden>
    인터넷 연결이 끊겼어요. 연결되면 자동으로 다시 동기화합니다. 지금은 제출할 수 없어요.
  </div>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="survey"><span aria-hidden="true">📝</span>설문</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="results"><span aria-hidden="true">📊</span>투표 현황</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="teams"><span aria-hidden="true">👥</span>팀 편성</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="guide"><span aria-hidden="true">🗺️</span>여행 가이드</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-tab="admin"><span aria-hidden="true">🔐</span>관리자</button>
  </nav>

  <main>
    <section id="view-survey" class="view" role="tabpanel" aria-label="설문">
      <div id="survey-progress" class="progress"></div>
      <div id="survey-card" class="card survey-card"></div>
      <div id="survey-nav" class="nav-row">
        <button type="button" id="btn-prev" class="btn btn-ghost">← 이전</button>
        <button type="button" id="btn-next" class="btn btn-primary">다음 →</button>
      </div>
    </section>

    <section id="view-results" class="view" role="tabpanel" aria-label="투표 현황" hidden></section>
    <section id="view-teams" class="view" role="tabpanel" aria-label="팀 편성" hidden></section>
    <section id="view-guide" class="view" role="tabpanel" aria-label="여행 가이드" hidden></section>
    <section id="view-admin" class="view" role="tabpanel" aria-label="관리자" hidden></section>
  </main>

  <footer class="foot">
    익명 로그인으로 이 브라우저를 구분합니다. 브라우저 데이터를 지우면 내 응답을 수정할 수 없으니 관리자에게 삭제를 요청하세요.
  </footer>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">확인</h3>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-ghost">취소</button>
        <button type="button" id="modal-ok" class="btn btn-danger">확인</button>
      </div>
    </div>
  </div>

  <noscript><div class="banner banner-error">이 웹앱은 JavaScript가 필요합니다.</div></noscript>
</body>
</html>
